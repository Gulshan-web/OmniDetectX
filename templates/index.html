<!DOCTYPE html>
<html>
<head>
    <title>OmniDetectX AI</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #111827);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 520px;
            background: rgba(255,255,255,0.08);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            text-align: center;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.6;
        }

        .upload-box {
            border: 2px dashed #38bdf8;
            padding: 30px;
            border-radius: 15px;
            margin: 25px 0;
            background: rgba(56,189,248,0.08);
        }

        input {
            margin-top: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #38bdf8;
            color: #020617;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0ea5e9;
        }

        .features {
            margin-top: 25px;
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>OmniDetectX AI</h1>
    <p>Multimodal AI system for object detection, OCR, handwriting recognition, scene understanding and AI image authenticity analysis.</p>

    <form action="/analyze" method="POST" enctype="multipart/form-data">
        <div class="upload-box">
            <h3>Upload Image</h3>
            <input type="file" name="image" accept="image/*" required>
        </div>

        <button type="submit">Analyze Image</button>
    </form>

    <div class="features">
        YOLO • OCR • TrOCR • BLIP • ResNet • SQLite
    </div>
</div>

</body>
</html>
